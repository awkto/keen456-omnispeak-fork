name: "Pages: web build"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EMSDK_VERSION: "6.0.13"   # what tools/build-wasm.sh and the keen456x dist are built with
    steps:
    - uses: actions/checkout@v4

    - name: Set up emsdk
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: ${{ env.EMSDK_VERSION }}
        actions-cache-folder: emsdk-cache

    - name: Fetch Keen 4 v1.4 shareware (freely redistributable)
      run: |
        export KEEN_DATA="$PWD/keen-data"
        tools/fetch-k4-shareware.sh

    - name: Build (Keen 4 bundled; Keen 5/6 = engine tables only)
      run: |
        KEEN_DATA="$PWD/keen-data" EPISODES="4 5 6" TABLES_ONLY="5 6" tools/build-wasm.sh
        touch dist/.nojekyll

    - name: Guard - no Keen 5/6 game data in the artifact
      run: tools/check-pages-artifact.sh dist

    - uses: actions/upload-pages-artifact@v3
      with:
        path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
