name: "Pages: manual web deploy"

# The live site is deployed by release.yml on every stable vX.Y.Z tag. This workflow is the manual
# override: Actions > "Pages: manual web deploy" > Run workflow, on main or on a v* tag.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EMSDK_VERSION: "6.0.13"   # what tools/build-wasm.sh and the keen456x dist are built with
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Set up emsdk
      uses: mymindstorm/setup-emsdk@667eb33f24e84e7f362c16d8d7fff0629a73e15e # v15
      with:
        version: ${{ env.EMSDK_VERSION }}
        actions-cache-folder: emsdk-cache

    - name: Pre-build the SDL2 port (once, with retries; parallel make would race the download)
      run: |
        for i in 1 2 3 4 5 6; do embuilder build sdl2 && exit 0; echo "retry $i"; sleep 30; done; exit 1

    - name: Fetch Keen 4 v1.4 shareware (freely redistributable)
      run: |
        export KEEN_DATA="$RUNNER_TEMP/keen-data"
        tools/fetch-k4-shareware.sh

    - name: Build (Keen 4 bundled; Keen 5/6 = engine tables only)
      run: |
        KEEN_DATA="$RUNNER_TEMP/keen-data" EPISODES="4 5 6" TABLES_ONLY="5 6" tools/build-wasm.sh
        touch dist/.nojekyll

    - name: Guard - no Keen 5/6 game data in the artifact
      run: tools/check-pages-artifact.sh dist

    - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
      with:
        path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
