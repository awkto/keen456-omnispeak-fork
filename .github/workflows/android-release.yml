name: android-release

# Push a tag android-YYYY.MM.DD[x] to build, sign and publish keen456-omni.apk as a GitHub
# Release asset (#102). workflow_dispatch builds and keeps the APK as a workflow artifact only.
on:
  push:
    tags: ['android-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Signing cert of the published APKs: updates only install over it with this exact key.
      EXPECTED_CERT_SHA256: a6629253002ec217f0db9a9705d42e7bb05d70b20d206e9ee96cd2c35da775ce
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # versionCode counts commits

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;27.2.12479018 cmake;3.22.1'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Version
        run: |
          SHORT=$(git rev-parse --short HEAD)
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            D=${GITHUB_REF_NAME#android-}; D=${D%%[a-z]}
          else
            D=$(date -u +%Y.%m.%d)
          fi
          echo "KEEN_VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "KEEN_VERSION_NAME=$D-$SHORT" >> "$GITHUB_ENV"
          echo "BUILD_HASH=$SHORT" >> "$GITHUB_ENV"

      - name: Build and sign (stable debug key)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          [ -n "$KS_B64" ] || { echo "ANDROID_KEYSTORE_B64 secret missing"; exit 1; }
          umask 077
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          export KEEN_DEBUG_KEYSTORE="$RUNNER_TEMP/debug.keystore"
          tools/build-android.sh
          cp dist/keen456-omni-*-debug.apk keen456-omni.apk
          rm -f "$RUNNER_TEMP/debug.keystore" "$HOME/.android/debug.keystore"

      - name: Verify signature, version and contents
        run: |
          set -euo pipefail
          BT=$ANDROID_HOME/build-tools/34.0.0
          got=$("$BT/apksigner" verify --print-certs keen456-omni.apk | grep -m1 'SHA-256 digest' | sed 's/.*: //')
          echo "cert sha256: $got"
          [ "$got" = "$EXPECTED_CERT_SHA256" ] || { echo "FAIL: wrong signing key"; exit 1; }
          "$BT/aapt" dump badging keen456-omni.apk | grep -m1 package:
          "$BT/aapt" dump badging keen456-omni.apk | grep -q "versionCode='$KEEN_VERSION_CODE'"
          bad=$(unzip -Z1 keen456-omni.apk | grep '^assets/game/' | grep -v '^assets/game/keen4/' || true)
          [ -z "$bad" ] || { echo "FAIL: non-keen4 game assets: $bad"; exit 1; }
          unzip -Z1 keen456-omni.apk | grep '^assets/game/'

      - uses: actions/upload-artifact@v4
        with:
          name: keen456-omni-${{ env.KEEN_VERSION_NAME }}
          path: keen456-omni.apk

      - name: Publish release asset
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$GITHUB_REF_NAME
          if ! gh release view "$tag" >/dev/null 2>&1; then
            cat > notes.md <<EOF
          Commander Keen 4/5/6 for Android, built on this Omnispeak fork (commit $BUILD_HASH, version $KEEN_VERSION_NAME, versionCode $KEEN_VERSION_CODE).

          - Keen 4 (shareware, the full episode) is built in. Keen 5 and 6: import your own game files (a folder or a .zip with EGAGRAPH, GAMEMAPS and AUDIO .CK5/.CK6).
          - Debug-signed with the same stable key as earlier releases, so it installs over android-2026.11.27 and later builds.
          - The installed version is shown at the bottom of the episode picker and in the Settings header.

          Source: this repository at the tagged commit (GPL-2.0-or-later).
          EOF
            sed -i 's/^          //' notes.md
            gh release create "$tag" --title "Android APK ${tag#android-}" --notes-file notes.md --latest
          fi
          gh release upload "$tag" keen456-omni.apk --clobber
