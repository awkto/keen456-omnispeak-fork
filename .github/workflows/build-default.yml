name: "CI: Build (Default)"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
    - name: Dependencies
      run: |
        sudo apt update
        sudo apt install libsdl2-dev mingw-w64 libasound2-dev libieee1284-3-dev
        wget https://github.com/andrewwutw/build-djgpp/releases/download/v3.1/djgpp-linux64-gcc1020.tar.bz2
        sudo tar xf djgpp-linux64-gcc1020.tar.bz2 -C /usr/local
        wget -nc https://davidgow.net/stuff/csdpmi7b.zip
        mkdir csdpmi7b
        unzip csdpmi7b.zip -d csdpmi7b/
        sudo mkdir -p /opt
    - name: Build (Linux)
      working-directory: ./src
      run: |
        make WITH_ALSA=1 WITH_IEEE1284=1
    - name: Build (Windows)
      working-directory: ./src
      run: |
        make PLATFORM=win32
        make PLATFORM=win64
    - name: Build (MS-DOS)
      working-directory: ./src
      run: |
        make PLATFORM=dos
        cp ../csdpmi7b/bin/CWSDPMI.EXE ../bin-dos
    - name: Upload (Linux)
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: Linux Build
        path: bin/
    - name: Upload (Windows)
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: Windows Build
        path: bin-win*/
    - name: Upload (MS-DOS)
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: MS-DOS Build
        path: bin-dos/
